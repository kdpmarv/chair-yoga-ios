workflows:
  ios-workflow:
    name: Chair Yoga iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: MoveWithLena
    environment:
      groups:
        - ios_signing
      vars:
        XCODE_SCHEME: "MoveWithLena"
        BUNDLE_ID: "com.readwithlena.chairyoga"
      xcode: 16.2
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build ipa for App Store
        script: |
          WORKSPACE_PATH=$(find . -maxdepth 3 -name "*.xcworkspace" | head -1)
          echo "Workspace found: $WORKSPACE_PATH"
          xcode-project build-ipa --workspace "$WORKSPACE_PATH" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
