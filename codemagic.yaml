workflows:
  ios-workflow:
    name: Chair Yoga iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: MoveWithLena
    environment:
      groups:
        - ios_signing
      vars:
        XCODE_SCHEME: "MoveWithLena"
        BUNDLE_ID: "com.base6a2f59489b82d2022df92eb7.app"
      xcode: latest
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Bump build number
        script: |
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          echo "New build number: $BUILD_NUMBER"
          PBXPROJ=$(find . -name "project.pbxproj" | head -1)
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBXPROJ"
          INFOPLIST=$(find . -name "Info.plist" -path "*MoveWithLena*" -not -path "*Frameworks*" | head -1)
          echo "Info.plist found: $INFOPLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$INFOPLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$INFOPLIST"
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build ipa for App Store
        script: |
          WORKSPACE_PATH=$(find . -maxdepth 3 -name "*.xcworkspace" | head -1)
          echo "Workspace found: $WORKSPACE_PATH"
          xcode-project build-ipa --workspace "$WORKSPACE_PATH" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
