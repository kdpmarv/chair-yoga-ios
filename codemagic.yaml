workflows:
  ios-workflow:
    name: Chair Yoga iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: MoveWithLena
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.readwithlena.chairyoga
      vars:
        XCODE_SCHEME: "MoveWithLena"
      xcode: latest
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa for App Store
        script: |
          WORKSPACE_PATH=$(find . -maxdepth 3 -name "*.xcworkspace" | head -1)
          echo "Workspace found: $WORKSPACE_PATH"
          xcode-project build-ipa --workspace "$WORKSPACE_PATH" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
